name: Phone engine (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone-engine/**"
      - ".github/workflows/phone-engine-windows.yml"

permissions:
  contents: read

env:
  PJPROJECT_VERSION: "2.15.1"
  # SHA-256 do tarball oficial do PJSIP (https://github.com/pjsip/pjproject/archive/refs/tags/2.15.1.tar.gz)
  PJPROJECT_SHA256: "8f3bd99caf003f96ed8038b8a36031eb9d8cd9eaea1eaff7e01c2eef6bd55706"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Baixar e conferir o PJSIP
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pjsip/pjproject/archive/refs/tags/$env:PJPROJECT_VERSION.tar.gz" -OutFile pj.tar.gz
          $hash = (Get-FileHash pj.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PJPROJECT_SHA256) { throw "SHA-256 do PJSIP não confere: $hash" }
          tar -xzf pj.tar.gz
          Rename-Item "pjproject-$env:PJPROJECT_VERSION" pjproject

      - name: Configurar o PJSIP (sem vídeo, sem IPv6)
        shell: pwsh
        run: |
          @"
          #define PJ_HAS_IPV6 0
          #define PJMEDIA_HAS_VIDEO 0
          #define PJSUA_MAX_CALLS 8
          #define PJMEDIA_HAS_OPENCORE_AMRNB_CODEC 0
          #define PJMEDIA_HAS_OPENCORE_AMRWB_CODEC 0
          #define PJ_HAS_SSL_SOCK 0
          "@ | Set-Content -Encoding ascii pjproject\pjlib\include\pj\config_site.h

      - name: Compilar o PJSIP (Release-Static x64, runtime estática /MT)
        shell: pwsh
        run: |
          msbuild pjproject\pjproject-vs14.sln -m -nologo -verbosity:minimal `
            -p:Configuration=Release-Static -p:Platform=x64 -p:PlatformToolset=v143 `
            -p:WindowsTargetPlatformVersion=10.0

      - name: Ambiente do compilador MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar o motor
        shell: cmd
        run: |
          mkdir out
          set PJ=%CD%\pjproject
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 /DPJ_WIN32=1 /DPJ_M_X86_64=1 ^
            /I"%PJ%\pjlib\include" /I"%PJ%\pjlib-util\include" /I"%PJ%\pjnath\include" ^
            /I"%PJ%\pjmedia\include" /I"%PJ%\pjsip\include" ^
            phone-engine\src\main.cpp /Fe:out\workscape-phone-engine.exe /Fo:out\ ^
            /link /LIBPATH:"%PJ%\pjlib\lib" /LIBPATH:"%PJ%\pjlib-util\lib" /LIBPATH:"%PJ%\pjnath\lib" ^
            /LIBPATH:"%PJ%\pjmedia\lib" /LIBPATH:"%PJ%\pjsip\lib" /LIBPATH:"%PJ%\third_party\lib" ^
            pjsua2-lib-x86_64-x64-vc14-Release-Static.lib pjsua-lib-x86_64-x64-vc14-Release-Static.lib ^
            pjsip-ua-x86_64-x64-vc14-Release-Static.lib pjsip-simple-x86_64-x64-vc14-Release-Static.lib ^
            pjsip-core-x86_64-x64-vc14-Release-Static.lib pjmedia-codec-x86_64-x64-vc14-Release-Static.lib ^
            pjmedia-audiodev-x86_64-x64-vc14-Release-Static.lib pjmedia-videodev-x86_64-x64-vc14-Release-Static.lib pjmedia-x86_64-x64-vc14-Release-Static.lib ^
            pjnath-x86_64-x64-vc14-Release-Static.lib pjlib-util-x86_64-x64-vc14-Release-Static.lib ^
            pjlib-x86_64-x64-vc14-Release-Static.lib libsrtp-x86_64-x64-vc14-Release-Static.lib ^
            libresample-x86_64-x64-vc14-Release-Static.lib libgsmcodec-x86_64-x64-vc14-Release-Static.lib ^
            libspeex-x86_64-x64-vc14-Release-Static.lib libilbccodec-x86_64-x64-vc14-Release-Static.lib ^
            libg7221codec-x86_64-x64-vc14-Release-Static.lib ^
            ws2_32.lib ole32.lib dsound.lib dxguid.lib winmm.lib iphlpapi.lib mswsock.lib ^
            advapi32.lib user32.lib oleaut32.lib uuid.lib

      - name: Teste de fumaça (o motor sobe e responde)
        shell: pwsh
        run: |
          $r = '{"cmd":"ping"}' | .\out\workscape-phone-engine.exe
          $r
          if (-not ($r -match '"pong"')) { throw "O motor não respondeu ao ping." }

      - name: Hash do executável
        shell: pwsh
        run: |
          Get-FileHash out\workscape-phone-engine.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  workscape-phone-engine.exe" } | Set-Content out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: workscape-phone-engine-win-x64
          path: |
            out/workscape-phone-engine.exe
            out/SHA256SUMS.txt
          if-no-files-found: error
